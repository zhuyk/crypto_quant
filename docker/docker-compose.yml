version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: crypto_quant_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cryptoquant2026}
      MYSQL_DATABASE: crypto_quant
      MYSQL_USER: ${DB_USER:-cryptoquant}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cryptoquant2026}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto_quant_net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: crypto_quant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto_quant_net

  # 后端 API 服务
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-cryptoquant}:${DB_PASSWORD:-cryptoquant2026}@mysql:3306/crypto_quant
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../config:/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - crypto_quant_net

  # Celery Worker (异步任务)
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_celery
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-cryptoquant}:${DB_PASSWORD:-cryptoquant2026}@mysql:3306/crypto_quant
      REDIS_URL: redis://redis:6379
      TZ: Asia/Shanghai
    volumes:
      - ../backend:/app
      - ../config:/config
    depends_on:
      - mysql
      - redis
    command: celery -A app.celery worker -l info --concurrency=4
    networks:
      - crypto_quant_net

  # Celery Beat (定时任务)
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_celery_beat
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-cryptoquant}:${DB_PASSWORD:-cryptoquant2026}@mysql:3306/crypto_quant
      REDIS_URL: redis://redis:6379
      TZ: Asia/Shanghai
    volumes:
      - ../backend:/app
      - ../config:/config
    depends_on:
      - mysql
      - redis
    command: celery -A app.celery beat -l info
    networks:
      - crypto_quant_net

  # 数据采集服务
  data-collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_collector
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-cryptoquant}:${DB_PASSWORD:-cryptoquant2026}@mysql:3306/crypto_quant
      REDIS_URL: redis://redis:6379
      TZ: Asia/Shanghai
    volumes:
      - ../backend:/app
      - ../config:/config
    depends_on:
      - mysql
      - redis
    command: python -m data.collector.service
    networks:
      - crypto_quant_net

  # 前端服务 (开发环境)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: crypto_quant_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      TZ: Asia/Shanghai
    command: npm run dev -- --host 0.0.0.0
    networks:
      - crypto_quant_net

  # 实时交易引擎
  trader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_trader
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-cryptoquant}:${DB_PASSWORD:-cryptoquant2026}@mysql:3306/crypto_quant
      REDIS_URL: redis://redis:6379
      TZ: Asia/Shanghai
    volumes:
      - ../backend:/app
      - ../config:/config
    depends_on:
      - mysql
      - redis
    command: python -m engine.trader.service
    networks:
      - crypto_quant_net
    profiles:
      - trading

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  crypto_quant_net:
    driver: bridge
