# ============================================
# CryptoQuant 生产环境 Docker Compose
# ============================================
# 用于生产部署，包含 Nginx、监控、日志等
# ============================================

version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: crypto_quant_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - crypto_quant_net
    labels:
      - "com.cryptoquant.service=nginx"

  # MySQL 数据库 (生产环境建议使用外部数据库)
  mysql:
    image: mysql:8.0
    container_name: crypto_quant_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: crypto_quant_prod
      MYSQL_USER: cryptoquant_prod
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"  # 仅本地访问
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=1G
      - --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crypto_quant_net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: crypto_quant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crypto_quant_net
    deploy:
      resources:
        limits:
          memory: 1G

  # 后端 API 服务 (多实例)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cryptoquant_prod:${DB_PASSWORD}@mysql:3306/crypto_quant_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      TZ: Asia/Shanghai
      LOG_LEVEL: WARNING
      LOG_FORMAT: json
    expose:
      - "8000"
    volumes:
      - ./logs/backend:/app/logs
      - ../config:/config:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4}
    networks:
      - crypto_quant_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    labels:
      - "com.cryptoquant.service=backend"
      - "com.cryptoquant.metrics.enabled=true"

  # Celery Worker (异步任务)
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_celery_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cryptoquant_prod:${DB_PASSWORD}@mysql:3306/crypto_quant_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      TZ: Asia/Shanghai
    volumes:
      - ./logs/celery:/app/logs
      - ../config:/config:ro
    depends_on:
      - mysql
      - redis
    command: celery -A app.celery worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --pool=gevent
    networks:
      - crypto_quant_net
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Celery Beat (定时任务)
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_celery_beat
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cryptoquant_prod:${DB_PASSWORD}@mysql:3306/crypto_quant_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TZ: Asia/Shanghai
    volumes:
      - ./logs/celery_beat:/app/logs
      - ../config:/config:ro
    depends_on:
      - mysql
      - redis
    command: celery -A app.celery beat -l info
    networks:
      - crypto_quant_net

  # 数据采集服务
  data-collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_collector
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cryptoquant_prod:${DB_PASSWORD}@mysql:3306/crypto_quant_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      TZ: Asia/Shanghai
    volumes:
      - ./logs/collector:/app/logs
      - ../config:/config:ro
    depends_on:
      - mysql
      - redis
    command: python -m data.collector.service
    networks:
      - crypto_quant_net
    deploy:
      resources:
        limits:
          memory: 512M

  # 前端服务 (生产构建)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend.prod
    container_name: crypto_quant_frontend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      VITE_API_BASE_URL: /api
      TZ: Asia/Shanghai
    volumes:
      - ./logs/frontend:/var/log/nginx
    networks:
      - crypto_quant_net
    deploy:
      resources:
        limits:
          memory: 512M

  # 实时交易引擎
  trader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_quant_trader
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cryptoquant_prod:${DB_PASSWORD}@mysql:3306/crypto_quant_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      BINANCE_TESTNET: "False"
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
    volumes:
      - ./logs/trader:/app/logs
      - ../config:/config:ro
    depends_on:
      - mysql
      - redis
    command: python -m engine.trader.service
    networks:
      - crypto_quant_net
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: crypto_quant_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - crypto_quant_net
    profiles:
      - monitoring

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: crypto_quant_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - crypto_quant_net
    profiles:
      - monitoring

  # Loki 日志聚合
  loki:
    image: grafana/loki:latest
    container_name: crypto_quant_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crypto_quant_net
    profiles:
      - monitoring

  # Promtail 日志收集
  promtail:
    image: grafana/promtail:latest
    container_name: crypto_quant_promtail
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/cryptoquant:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - crypto_quant_net
    profiles:
      - monitoring

  # Node Exporter (系统指标)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: crypto_quant_node_exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - crypto_quant_net
    profiles:
      - monitoring

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  crypto_quant_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
