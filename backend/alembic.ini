# Alembic 数据库迁移配置
# 用法:
#   cd backend
#   alembic revision --autogenerate -m "描述"
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .

# SQLAlchemy URL 会被 env.py 覆盖 (从 app.core.config 读取)
sqlalchemy.url = sqlite:///./crypto_quant_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
